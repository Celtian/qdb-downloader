<section
  class="mx-auto grid max-w-256 gap-5 px-4 py-10 md:px-14"
  aria-labelledby="source-settings-title"
>
  <app-page-header
    eyebrow="Source data"
    heading="Sources"
    description="Set which provider wins when project records are automatically resolved."
    headingId="source-settings-title"
  />

  @if (error()) {
    <p class="text-error" role="alert">{{ error() }}</p>
  }

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Provider priority</mat-card-title>
      <mat-card-subtitle>
        Drag providers or use the arrow buttons. The first non-empty value wins.
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (loading()) {
        <mat-progress-bar mode="indeterminate" aria-label="Loading source priority" />
      } @else {
        <ol
          cdkDropList
          class="mt-4 grid list-none gap-2 p-0"
          aria-label="Source priority"
          [cdkDropListData]="priority()"
          (cdkDropListDropped)="drop($event)"
        >
          @for (sourceName of priority(); track sourceName) {
            <li
              class="flex min-h-14 items-center gap-3 rounded-xl border border-outline-variant bg-surface px-2.5 py-1.5"
              cdkDrag
            >
              <button
                cdkDragHandle
                matIconButton
                type="button"
                [attr.aria-label]="'Drag ' + sourceLabels[sourceName]"
              >
                <mat-icon aria-hidden="true">drag_indicator</mat-icon>
              </button>
              <span
                class="grid size-8 place-items-center rounded-full bg-secondary-container"
                aria-hidden="true"
              >
                {{ $index + 1 }}
              </span>
              <strong>{{ sourceLabels[sourceName] }}</strong>
              <span class="flex-1"></span>
              <button
                matIconButton
                type="button"
                [disabled]="$first || saving()"
                [attr.aria-label]="'Move ' + sourceLabels[sourceName] + ' up'"
                (click)="move(sourceName, -1)"
              >
                <mat-icon aria-hidden="true">arrow_upward</mat-icon>
              </button>
              <button
                matIconButton
                type="button"
                [disabled]="$last || saving()"
                [attr.aria-label]="'Move ' + sourceLabels[sourceName] + ' down'"
                (click)="move(sourceName, 1)"
              >
                <mat-icon aria-hidden="true">arrow_downward</mat-icon>
              </button>
            </li>
          }
        </ol>
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <button matButton type="button" [disabled]="loading() || saving()" (click)="reset()">
        <mat-icon aria-hidden="true">restart_alt</mat-icon>
        Reset default
      </button>
    </mat-card-actions>
  </mat-card>
</section>
