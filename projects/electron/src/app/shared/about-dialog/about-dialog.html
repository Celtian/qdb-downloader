<div
  class="grid grid-cols-about-dialog items-center gap-5 px-8 pt-9 pb-3 max-sm:grid-cols-about-dialog-compact max-sm:gap-3.5 max-sm:px-5 max-sm:pt-6 max-sm:pb-3"
>
  <img
    class="block rounded-2xl bg-app-navy max-sm:size-15"
    ngSrc="qdb-downloader.png"
    width="72"
    height="72"
    alt=""
    priority
  />
  <div class="min-w-0">
    <h2
      class="m-0 p-0 text-3xl leading-tight tracking-tight before:hidden max-sm:text-2xl"
      mat-dialog-title
    >
      QDB Downloader
    </h2>
    <p class="mt-1.5 mb-0 text-lg text-on-surface-variant max-sm:text-base">
      Version {{ version }}
    </p>
  </div>
  <button
    class="self-start"
    matIconButton
    mat-dialog-close
    type="button"
    aria-label="Close About dialog"
  >
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <p class="m-0 text-base leading-relaxed text-on-surface">
    Local-first desktop app for creating date-based football-data snapshots from Transfermarkt,
    Soccerway, and WorldFootball.
  </p>
  <p class="mt-5 mb-0 text-on-surface-variant">© {{ currentYear }} {{ author }} · MIT License</p>
</mat-dialog-content>

<mat-dialog-actions>
  <button class="max-sm:w-full max-sm:justify-center" matButton mat-dialog-close type="button">
    Close
  </button>
  <div class="flex items-center gap-2 max-sm:grid max-sm:items-stretch">
    <a
      class="max-sm:w-full max-sm:justify-center"
      matButton
      href="https://celtian.github.io/qdb-downloader/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Documentation (opens in the system browser)"
    >
      <mat-icon aria-hidden="true">menu_book</mat-icon>
      Documentation
    </a>
    <a
      class="max-sm:w-full max-sm:justify-center"
      matButton="filled"
      href="https://github.com/Celtian/qdb-downloader"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub (opens in the system browser)"
    >
      <mat-icon aria-hidden="true">code</mat-icon>
      GitHub
    </a>
  </div>
</mat-dialog-actions>
