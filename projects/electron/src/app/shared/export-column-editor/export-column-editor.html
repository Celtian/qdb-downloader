<mat-tab-group
  class="export-column-tabs"
  animationDuration="0ms"
  aria-label="Export columns by entity"
  [preserveContent]="true"
>
  @for (entity of entities; track entity) {
    <mat-tab [label]="entityLabels[entity]">
      <div class="column-tab-content">
        <div class="column-tab-actions">
          <button
            matButton
            type="button"
            [attr.aria-label]="
              'Select all ' + entityLabels[entity].toLowerCase() + ' export columns'
            "
            [disabled]="disabled()"
            (click)="selectAll(entity)"
          >
            Select all
          </button>
        </div>
        <div
          class="checkbox-grid"
          role="group"
          [attr.aria-label]="entityLabels[entity] + ' export columns'"
        >
          @for (column of columnDefinitions[entity]; track column.key) {
            <mat-checkbox
              [checked]="isSelected(entity, column.key)"
              [disabled]="disabled() || isLastSelected(entity, column.key)"
              (change)="toggle(entity, column.key, $event.checked)"
            >
              {{ column.label }}
            </mat-checkbox>
          }
        </div>
      </div>
    </mat-tab>
  }
</mat-tab-group>
